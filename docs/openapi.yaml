  /v1/scheduled-messages/:
    get:
      operationId: scheduled_messages_retrieve
      tags:
      - scheduled-messages
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: scheduled_messages_create
      tags:
      - scheduled-messages
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /v1/scheduled-messages/{id}:
    get:
      operationId: scheduled_messages_retrieve_2
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - scheduled-messages
      security:
      - jwtAuth: []
      - cookieAuth: []
