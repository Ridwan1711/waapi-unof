name: Bug report
description: Report a problem so we can fix it
title: "fix: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug report!
  - type: dropdown
    id: service
    attributes:
      label: Affected service
      options:
        - frontend
        - backend
        - wa-service
        - infrastructure / docker
        - docs
        - not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Call endpoint ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant log output. Redact secrets/tokens.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - Deployment: Dokploy / docker compose / local
        - OS:
        - Browser (if frontend):
        - Version / commit:
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I removed all secrets/tokens from logs above
          required: true
