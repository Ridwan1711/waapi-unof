        '200':
          description: No response body
  /v1/scheduled-messages/{id}/cancel:
    post:
      operationId: scheduled_messages_cancel_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - scheduled-messages
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /v1/webhooks/:
    get:
      operationId: webhooks_retrieve
      tags:
      - webhooks
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: webhooks_create
      tags:
      - webhooks
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /v1/webhooks/{id}:
    get:
      operationId: webhooks_retrieve_2
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - webhooks
      security:
      - jwtAuth: []
