# Routing for the optional bundled nginx profile.
#   /v1 /api /admin /static /health /sse  -> Django API (incl. SSE streaming)
#   everything else                       -> Next.js frontend
#
# This is an HTTP-only baseline. For production behind nginx, terminate TLS here
# (add a 443 server block + certs, e.g. via certbot) or front it with your own
# TLS terminator. On Dokploy, Traefik manages TLS automatically.

upstream waapi_api {
    server api:8000;
}

upstream waapi_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # ----- Django API (REST, admin, static, health, and SSE) -----
    location ~ ^/(v1|api|admin|static|health|sse) {
        proxy_pass http://waapi_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events: disable buffering, keep the connection open.
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }

    # ----- Next.js frontend (default) -----
    location / {
        proxy_pass http://waapi_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support Next.js HMR / websocket upgrades where applicable.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
