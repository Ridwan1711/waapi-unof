      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /v1/devices/{id}/logout:
    post:
      operationId: devices_logout_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - devices
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /v1/messages/:
    get:
      operationId: messages_retrieve
      tags:
      - messages
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: messages_create
      tags:
      - messages
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /v1/messages/{id}:
    get:
      operationId: messages_retrieve_2
      parameters:
      - in: path
        name: id
        schema:
          type: string
